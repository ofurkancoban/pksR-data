# Scheduled data pipeline (brief Section 9.1): fetch and verify raw files,
# look for new years, test, build, validate, and release.
#
# Releases:
#   scheduled run      public release "v<version>" when the data changed,
#                      only if the repository variable PUBLISH_ENABLED is
#                      "true" (set it once the BKA terms of reuse are
#                      confirmed); otherwise the run only checks
#   manual, test       draft prerelease "test-<version>-run<n>"
#   manual, publish    as a scheduled run
# Any failure or finding opens an issue; nothing is published then.
#
# A newer BBSR crosswalk edition (found by the discovery step) is prepared
# by the crosswalk job: registry update, trial build and tests on a branch
# "auto/bbsr-<file>", a pull request and an issue. Merging stays with the
# maintainer, because the new rows are a territorial mapping.
#
# A changed INKAR population snapshot (new year or BBSR revision) is
# prepared the same way by the inkar job on a branch "auto/inkar-<tag>":
# the snapshot moves population_corrected, so it also waits for a merge.
name: pipeline

on:
  schedule:
    - cron: "17 5 1 * *"      # monthly, 1st day, 05:17 UTC
    - cron: "17 5 * 3-5 1"    # weekly on Mondays from March to May (PKS release season)
  workflow_dispatch:
    inputs:
      release:
        description: "Release to create"
        type: choice
        options: [none, test, publish]
        default: none

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      crosswalk_url: ${{ steps.discover.outputs.crosswalk_url }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Cloudflare Worker for bka.de (ci/proxy/worker.js); unset: direct
      PKSR_PROXY_URL: ${{ secrets.BKA_PROXY_URL }}
      PKSR_PROXY_KEY: ${{ secrets.BKA_PROXY_KEY }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      RELEASE_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - name: Fetch and verify raw files
        run: Rscript ci/fetch.R

      # Informational: an unreachable bka.de must never block build or release
      - name: Discover new years and republished files
        id: discover
        timeout-minutes: 20
        continue-on-error: true
        run: Rscript ci/discover.R

      - name: Build and validate
        run: Rscript -e 'targets::tar_make()'

      # After the build, so the integration tests run on the real outputs
      # instead of skipping
      - name: Tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Release (dry run)
        if: env.RELEASE_MODE == 'test'
        run: Rscript ci/release.R test

      - name: Release
        if: env.RELEASE_MODE == 'publish' && vars.PUBLISH_ENABLED == 'true'
        run: Rscript ci/release.R publish

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            output/ci/
            output/validation/
            output/release/manifest.json
          if-no-files-found: ignore

      - name: Issue on failure
        if: failure()
        run: |
          Rscript ci/issue_body.R failure > issue.md
          title="Pipeline failed ($(date -u +%Y-%m-%d))"
          gh issue create --title "$title" --body-file issue.md

      - name: Issue on findings
        if: success() && steps.discover.outputs.found == 'true'
        run: |
          title="New or republished PKS files found"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            Rscript ci/issue_body.R discovery > issue.md
            gh issue create --title "$title" --body-file issue.md
          fi

      - name: Commit status file
        if: always() && github.event_name == 'schedule'
        env:
          PKSR_OUTCOME: ${{ job.status }}
        run: |
          Rscript ci/status.R
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last_check.json
          git commit -m "chore(pipeline): update status of scheduled run" || exit 0
          git pull --rebase
          git push

  crosswalk:
    needs: pipeline
    # Also after a failed pipeline run: a new crosswalk may be the reason
    if: always() && needs.pipeline.outputs.crosswalk_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PKSR_PROXY_URL: ${{ secrets.BKA_PROXY_URL }}
      PKSR_PROXY_KEY: ${{ secrets.BKA_PROXY_KEY }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CROSSWALK_URL: ${{ needs.pipeline.outputs.crosswalk_url }}
    steps:
      - uses: actions/checkout@v4

      # One branch per edition: a later run does not prepare it again
      - name: Check for an existing update branch
        id: branch
        run: |
          file=$(basename "${CROSSWALK_URL%%\?*}" .xlsx)
          branch="auto/bbsr-$file"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch $branch exists already; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.branch.outputs.exists == 'false'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.branch.outputs.exists == 'false'
        with:
          dependencies: '"all"'

      - name: Fetch and verify raw files
        if: steps.branch.outputs.exists == 'false'
        run: Rscript ci/fetch.R

      - name: Update the registry to the new crosswalk
        if: steps.branch.outputs.exists == 'false'
        run: Rscript ci/update_crosswalk.R "$CROSSWALK_URL"

      # Trial on the updated registry; the outcome goes into the pull request
      - name: Trial build
        id: build
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: Rscript -e 'targets::tar_make()'

      - name: Trial tests
        id: tests
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Push branch, open pull request and issue
        if: steps.branch.outputs.exists == 'false'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add registry/reference_sources.csv registry/boundary_map.csv
          Rscript ci/issue_body.R crosswalk-commit > message.txt
          git commit -F message.txt
          git push origin "$BRANCH"
          title="New BBSR crosswalk: $(basename "$BRANCH" | sed 's/^bbsr-//')"
          Rscript ci/issue_body.R crosswalk > body.md
          # Needs "Allow GitHub Actions to create and approve pull requests"
          # in the repository settings; without it the issue names the branch
          PR_URL=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "$(head -n 1 message.txt)" --body-file body.md) || PR_URL=""
          export PR_URL
          Rscript ci/issue_body.R crosswalk > body.md
          gh issue create --title "$title" --body-file body.md

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosswalk-reports
          path: |
            output/ci/
            output/validation/
          if-no-files-found: ignore

  inkar:
    # Independent of bka.de: INKAR can change in any month
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PKSR_PROXY_URL: ${{ secrets.BKA_PROXY_URL }}
      PKSR_PROXY_KEY: ${{ secrets.BKA_PROXY_KEY }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - name: Fetch the INKAR population
        id: fetch
        run: Rscript ci/fetch_inkar.R

      # One branch per snapshot: a later run does not prepare it again
      - name: Check for an existing update branch
        id: branch
        if: steps.fetch.outputs.changed == 'true'
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
        run: |
          branch="auto/inkar-$TAG"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch $branch exists already; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and verify raw files
        if: steps.branch.outputs.exists == 'false'
        run: Rscript ci/fetch.R

      # Trial on the new snapshot; the outcome goes into the pull request
      - name: Trial build
        id: build
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: Rscript -e 'targets::tar_make()'

      - name: Trial tests
        id: tests
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Push branch, open pull request and issue
        if: steps.branch.outputs.exists == 'false'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add registry/population_inkar.csv registry/inkar_sources.csv
          Rscript ci/issue_body.R inkar-commit > message.txt
          git commit -F message.txt
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "$(head -n 1 message.txt)" --body-file message.txt) || PR_URL=""
          export PR_URL
          Rscript ci/issue_body.R inkar > body.md
          gh issue create --title "New INKAR population snapshot: ${BRANCH#auto/inkar-}" --body-file body.md

      # The release does not depend on this job; a failure only means the
      # snapshot could not be checked, so one open issue is enough
      - name: Issue on failure
        if: failure()
        run: |
          title="INKAR snapshot check failed"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            {
              echo "Run: $run"
              echo
              echo "ci/fetch_inkar.R failed, so the INKAR population snapshot was not checked. The committed snapshot is still used and releases are not affected. See the log of the job inkar."
            } > issue.md
            gh issue create --title "$title" --body-file issue.md
          fi

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkar-reports
          path: |
            output/ci/
            output/validation/
          if-no-files-found: ignore
