# Manual diagnosis of the connection failures to bka.de from GitHub runners
# (notes/decisions.md, raw-file mirror). Shows the runner's public IP and
# network, then times each connection phase (DNS, TCP, TLS, first byte) for
# a few requests to bka.de, with destatis.de as a control. Touches no data
# and never fails.
name: diagnose

on:
  workflow_dispatch:
    inputs:
      only_worker:
        description: "Run only the probes through the Cloudflare Worker"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UA: "pksR-data (R pipeline for German Police Crime Statistics; https://github.com/ofurkancoban/pksR-data)"
    steps:
      - name: Runner network
        if: ${{ !inputs.only_worker }}
        continue-on-error: true
        run: |
          echo "Public IP and network of this runner:"
          curl -s --max-time 20 https://ipinfo.io/json || echo "ipinfo.io not reachable"
          echo
          echo "DNS for www.bka.de:"
          getent ahosts www.bka.de || echo "DNS lookup failed"

      - name: Timed requests
        if: ${{ !inputs.only_worker }}
        continue-on-error: true
        run: |
          # Actions runs bash with -e; a failed curl must not end the probes
          set +e
          page="https://www.bka.de/DE/AktuelleInformationen/StatistikenLagebilder/PolizeilicheKriminalstatistik/pks_node.html"
          pdf="https://www.bka.de/SharedDocs/Downloads/DE/Publikationen/PolizeilicheKriminalstatistik/pksJahrbuecherBis2011/pks2003.pdf?__blob=publicationFile&v=2"
          control="https://www.destatis.de/DE/Themen/Laender-Regionen/Regionales/Gemeindeverzeichnis/Namens-Grenz-Aenderung/2003.html"
          fmt='%{http_code} | %{remote_ip} | dns %{time_namelookup}s | tcp %{time_connect}s | tls %{time_appconnect}s | first byte %{time_starttransfer}s | total %{time_total}s | exit '
          {
            echo "| target | attempt | http | remote ip | timings | curl exit |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          probe() {
            name="$1"; url="$2"; extra="$3"
            for i in 1 2 3 4 5; do
              echo "::group::$name attempt $i"
              out=$(curl -v -sS -o /dev/null -A "$UA" --connect-timeout 30 --max-time 60 $extra -w "$fmt" "$url" 2>curl.err); code=$?
              sed -n '1,40p' curl.err
              echo "$out$code"
              echo "::endgroup::"
              http=$(echo "$out" | cut -d'|' -f1); ip=$(echo "$out" | cut -d'|' -f2)
              timings=$(echo "$out" | cut -d'|' -f3-7 | sed 's/|/,/g')
              echo "| $name | $i | $http | $ip | $timings | $code |" >> "$GITHUB_STEP_SUMMARY"
              sleep 15
            done
          }
          probe "bka.de page" "$page" ""
          probe "bka.de pdf (first 1 KB)" "$pdf" "-r 0-1023"
          probe "destatis.de page (control)" "$control" ""

      # Same probes through the Cloudflare Worker in ci/proxy/worker.js, when
      # the secrets BKA_PROXY_URL and BKA_PROXY_KEY are set. Compares direct
      # access with access from Cloudflare's network.
      - name: Timed requests through the Cloudflare Worker
        continue-on-error: true
        env:
          PROXY_URL: ${{ secrets.BKA_PROXY_URL }}
          PROXY_KEY: ${{ secrets.BKA_PROXY_KEY }}
        run: |
          set +e
          if [ -z "$PROXY_URL" ] || [ -z "$PROXY_KEY" ]; then
            echo "BKA_PROXY_URL or BKA_PROXY_KEY not set; skipped."
            exit 0
          fi
          enc() { python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          page="https://www.bka.de/DE/AktuelleInformationen/StatistikenLagebilder/PolizeilicheKriminalstatistik/pks_node.html"
          pdf="https://www.bka.de/SharedDocs/Downloads/DE/Publikationen/PolizeilicheKriminalstatistik/pksJahrbuecherBis2011/pks2003.pdf?__blob=publicationFile&v=2"
          fmt='%{http_code} | dns %{time_namelookup}s | tcp %{time_connect}s | tls %{time_appconnect}s | first byte %{time_starttransfer}s | total %{time_total}s | exit '
          {
            echo ""
            echo "| target (via Worker) | attempt | http | timings | curl exit |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          probe() {
            name="$1"; url="$2"; extra="$3"
            for i in 1 2 3 4 5; do
              out=$(curl -sS -o body.bin -A "$UA" -H "X-Proxy-Key: $PROXY_KEY" --connect-timeout 30 --max-time 60 $extra -w "$fmt" "$PROXY_URL/?url=$(enc "$url")" 2>curl.err); code=$?
              cat curl.err
              echo "$name $i: $out$code"
              # "Forbidden." is the Worker's own refusal (key mismatch);
              # anything else came from bka.de
              echo "body start: $(head -c 300 body.bin | tr -d '\r' | tr '\n' ' ')"
              http=$(echo "$out" | cut -d'|' -f1)
              timings=$(echo "$out" | cut -d'|' -f2-6 | sed 's/|/,/g')
              echo "| $name | $i | $http | $timings | $code |" >> "$GITHUB_STEP_SUMMARY"
              sleep 15
            done
          }
          probe "bka.de page" "$page" ""
          probe "bka.de pdf (first 1 KB)" "$pdf" "-r 0-1023"

      # Whole files through the Worker: size, SHA-256, headers and first
      # bytes, compared with the registered values. Run 40740995930 got
      # other hashes through the Worker for 9 files that are unchanged at
      # the source.
      - name: Whole files through the Cloudflare Worker
        continue-on-error: true
        env:
          PROXY_URL: ${{ secrets.BKA_PROXY_URL }}
          PROXY_KEY: ${{ secrets.BKA_PROXY_KEY }}
        run: |
          set +e
          if [ -z "$PROXY_URL" ] || [ -z "$PROXY_KEY" ]; then echo "secrets not set; skipped."; exit 0; fi
          enc() { python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          check() {
            name="$1"; url="$2"; sha="$3"; size="$4"
            curl -sS -D headers.txt -o file.bin -A "$UA" -H "X-Proxy-Key: $PROXY_KEY" --max-time 300 "$PROXY_URL/?url=$(enc "$url")"
            echo "::group::$name"
            cat headers.txt
            echo "registered: size $size sha256 $sha"
            echo "received:   size $(stat -c %s file.bin) sha256 $(sha256sum file.bin | cut -d' ' -f1)"
            echo "first bytes: $(head -c 120 file.bin | tr -d '\r' | tr '\n' ' ' | tr -c '[:print:]' '.')"
            echo "::endgroup::"
            sleep 10
          }
          check "bund 2022" "https://www.bka.de/SharedDocs/Downloads/DE/Publikationen/PolizeilicheKriminalstatistik/2022/Bund/Faelle/BU-F-01-T01-Faelle_xls.xlsx?__blob=publicationFile&v=3" 9fd430554f7b72b4cd3973bf8b4dc0c5696e7160f346bc9ddb3e5d338d843e9d 165613
          check "pks 2003" "https://www.bka.de/SharedDocs/Downloads/DE/Publikationen/PolizeilicheKriminalstatistik/pksJahrbuecherBis2011/pks2003.pdf?__blob=publicationFile&v=2" e5015b0ba1234bfd071de0d5a3e373979ce156ff0698e5247c40c684ce7f32e3 6239938

  # Why the pipeline's GITHUB_TOKEN may not create the dry-run release
  # (HTTP 403 "Resource not accessible by integration" in run 40728437461
  # with Contents: write). Creates two throwaway draft releases, one with
  # and one without target_commitish, prints GitHub's answer and deletes
  # whatever was created.
  release-api:
    if: ${{ !inputs.only_worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create and delete probe draft releases
        continue-on-error: true
        run: |
          set +e
          # parent: a commit whose workflow files differ from the default
          # branch head (this commit changes diagnose.yml)
          parent=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[0].sha')
          for variant in plain commitish parent; do
            tag="probe-${GITHUB_RUN_ID}-${variant}"
            case "$variant" in
              commitish) extra=(-f "target_commitish=$GITHUB_SHA") ;;
              parent) extra=(-f "target_commitish=$parent") ;;
              *) extra=() ;;
            esac
            echo "::group::$variant"
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f "tag_name=$tag" -F draft=true -F prerelease=true "${extra[@]}" > out.json 2> err.txt
            code=$?
            cat out.json err.txt
            echo "::endgroup::"
            id=$(python3 -c 'import json; print(json.load(open("out.json")).get("id", ""))' 2>/dev/null)
            echo "| $variant | exit $code | id ${id:-none} |" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" && echo "deleted probe $id"; fi
          done

  # The same probe through the pipeline's own R client (R/github.R), to tell
  # a token problem from a problem in how the client sends the request.
  release-api-r:
    if: ${{ !inputs.only_worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Create and delete a probe draft release from R
        continue-on-error: true
        run: |
          cat > probe.R <<'RSCRIPT'
          for (f in c("R/utils.R", "R/download.R", "R/github.R")) source(f)
          tok <- github_token()
          cat("token prefix:", substr(tok, 1, 4), "length:", nchar(tok), "\n")
          cat("GITHUB_PAT set:", nzchar(Sys.getenv("GITHUB_PAT")), " same as GITHUB_TOKEN:", identical(Sys.getenv("GITHUB_PAT"), Sys.getenv("GITHUB_TOKEN")), "\n")
          repo <- Sys.getenv("GITHUB_REPOSITORY")
          r <- tryCatch(
            github_release_create(repo, paste0("probe-r-", Sys.getenv("GITHUB_RUN_ID")), "Probe, deleted at once.", draft = TRUE, prerelease = TRUE, commit = Sys.getenv("GITHUB_SHA")),
            error = function(e) { cat("ERROR:", conditionMessage(e), "\n"); NULL }
          )
          if (!is.null(r)) {
            cat("created release id", format(r$id, scientific = FALSE), "\n")
            writeLines(format(r$id, scientific = FALSE), "probe_id.txt")
          }
          RSCRIPT
          Rscript probe.R
          if [ -f probe_id.txt ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$(cat probe_id.txt)" && echo "deleted probe"; fi

  # The pipeline's own download path (download_file() in R/download.R)
  # through the Worker, for the nine files that came back with other hashes
  # in run 40740995930 while curl through the same Worker got them right.
  fetch-r:
    if: ${{ inputs.only_worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PKSR_PROXY_URL: ${{ secrets.BKA_PROXY_URL }}
      PKSR_PROXY_KEY: ${{ secrets.BKA_PROXY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Download through the Worker from R
        continue-on-error: true
        run: |
          cat > probe.R <<'RSCRIPT'
          for (f in c("R/utils.R", "R/download.R", "R/mirror.R")) source(f)
          inv <- raw_inventory()
          pick <- (inv$registry == "sources" & inv$label %in% c("2003", "2005", "2011", "2015", "2016")) |
            (inv$registry == "bund_sources" & inv$label %in% c("2022", "2023", "2024", "2025"))
          for (i in which(pick)) {
            tmp <- tempfile()
            res <- tryCatch({
              resp <- httr2::req_perform(pksr_request(inv$url[i]), path = tmp)
              sprintf("http %s, content-type %s, content-encoding %s, content-length %s",
                      httr2::resp_status(resp), httr2::resp_header(resp, "content-type") %||% "-",
                      httr2::resp_header(resp, "content-encoding") %||% "-", httr2::resp_header(resp, "content-length") %||% "-")
            }, error = function(e) paste("error:", conditionMessage(e)))
            sha <- if (file.exists(tmp)) sha256_file(tmp) else NA
            first <- if (file.exists(tmp)) gsub("[^[:print:]]", ".", rawToChar(readBin(tmp, "raw", 60)[readBin(tmp, "raw", 60) != as.raw(0)])) else ""
            cat(sprintf("%s %s | %s | size %s | %s | first: %s\n", inv$registry[i], inv$label[i], res,
                        if (file.exists(tmp)) file.size(tmp) else NA,
                        if (identical(sha, inv$sha256[i])) "HASH OK" else paste("HASH DIFFERS", substr(sha, 1, 10)), first))
          }
          RSCRIPT
          Rscript probe.R
